name: Build Fedora GPU ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar QEMU y Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 podman

      - name: Construir Imagen ISO
        run: |
          chmod +x scripts/build-iso.sh
          sudo ./scripts/build-iso.sh

      - name: Subir ISO como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Fedora-GPU-ISO
          path: out/*.iso
          retention-days: 7
