name: Build Fedora compresSO ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Verificar archivos requeridos
        run: |
          test -f kickstarts/fedora-gpu-live.ks || (echo "ERROR: kickstarts/fedora-gpu-live.ks no encontrado" && exit 1)
          chmod +x scripts/build-iso.sh

      - name: Construir Imagen ISO
        run: |
          sudo ./scripts/build-iso.sh

      - name: Subir ISO resultante
        uses: actions/upload-artifact@v4
        with:
          name: Fedora-compresSO-ISO
          path: out/*.iso
          retention-days: 7
