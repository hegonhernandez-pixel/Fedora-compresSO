name: CompressOS-HAL EXP tests

on:
  push:
    branches:
      - main
      - "exp/**"
    paths:
      - "compressos-hal-exp/**"
      - ".github/workflows/compresso-hal-exp-tests.yml"
  pull_request:
    paths:
      - "compressos-hal-exp/**"
      - ".github/workflows/compresso-hal-exp-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compressos-hal-exp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and runtime tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check shell syntax
        run: bash -n scripts/*.sh
